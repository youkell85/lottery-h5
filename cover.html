<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投资者知识问答 - 国元证券</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 15px;
        }

        .logo-text {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
        }

        .cover-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cover-image {
            width: 100%;
            display: block;
        }

        .start-btn {
            position: absolute;
            bottom: 33%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(238, 90, 90, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            z-index: 10;
        }

        .start-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 35px rgba(238, 90, 90, 0.6);
        }

        .start-btn:active {
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <div class="logo-text">🏛️ 国元证券投教活动</div>
        </div>

        <div class="cover-wrapper">
            <img src="cover.jpg" alt="活动封面" class="cover-image">
            <a href="https://ks.wjx.com/vm/YrE1ZCF.aspx" class="start-btn">
                点击开始答题
            </a>
        </div>

        <div class="footer">
            答题满分（100分）即可参与抽奖<br>
            每人限抽奖一次
        </div>
    </div>
</body>
</html>
